<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Blockfall</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="shell">
    <section class="game-panel" aria-label="Tetris game">
      <div class="heading-row">
        <div>
          <p class="eyebrow">BLOCKFALL / 001</p>
          <h1>Tetris</h1>
        </div>
        <div class="status" id="status">READY</div>
      </div>
      <p class="live-status" id="live-status" role="status" aria-live="polite">CLASSIC / READY</p>
      <canvas id="board" width="300" height="600" aria-label="Tetris board" tabindex="0"></canvas>
      <div class="mobile-controls" aria-label="Touch controls">
        <button data-action="left" aria-label="Move left">&#8592;</button>
        <button data-action="rotate" aria-label="Rotate">&#8635;</button>
        <button data-action="right" aria-label="Move right">&#8594;</button>
        <button data-action="drop" aria-label="Hard drop">&#8595;</button>
      </div>
    </section>

    <aside class="sidebar">
      <div class="brand-mark" aria-hidden="true">+</div>
      <p class="eyebrow">CURRENT RUN</p>
      <div class="score-block">
        <span>SCORE</span>
        <strong id="score">000000</strong>
      </div>
      <div class="stats">
        <div><span>LINES</span><strong id="lines">00</strong></div>
        <div><span>LEVEL</span><strong id="level">01</strong></div>
      </div>
      <div class="next-block">
        <span>NEXT PIECE</span>
        <canvas id="next" width="120" height="100"></canvas>
      </div>
      <div class="next-block">
        <span>HOLD PIECE</span>
        <canvas id="hold" width="120" height="100"></canvas>
      </div>
      <div class="scores-block">
        <span>TOP SCORES</span>
        <ol id="high-scores" aria-label="Top scores"></ol>
      </div>
      <label class="mode-label" for="mode">MODE
        <select id="mode">
          <option value="classic">Classic</option>
          <option value="sprint">Sprint / 40 lines</option>
          <option value="time">Time attack</option>
        </select>
      </label>
      <div class="settings-row">
        <button class="utility" id="mute">Sound on</button>
        <button class="utility" id="theme">Night theme</button>
        <button class="utility" id="fullscreen">Fullscreen</button>
      </div>
      <div class="score-tools">
        <button class="utility" id="export-scores">Export scores</button>
        <button class="utility" id="import-scores">Import scores</button>
        <input id="score-file" type="file" accept="application/json" hidden>
      </div>
      <button class="secondary" data-action="hold">Hold piece</button>
      <button class="primary" id="start">Start game</button>
      <p class="hint">ARROWS MOVE<br>UP ROTATES<br>SPACE DROPS<br>C HOLDS<br>P PAUSES</p>
    </aside>
  </main>
  <script src="game.js"></script>
</body>
</html>
